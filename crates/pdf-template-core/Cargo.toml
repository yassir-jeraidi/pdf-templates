[package]
name = "pdf-template-core"
version = "0.1.0"
edition = "2021"
authors = ["Yassir Jeraidi"]
description = "Core engine for PDF template inspection, validation, and rendering"

[dependencies]
lopdf = { version = "0.45.0" }
ttf-parser = "0.25.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"
encoding_rs = "0.8"
log = "0.4"
