[package]
name = "pdf-template-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12", default-features = false, features = ["napi4"] }
napi-derive = "3.1"
pdf-template-core = { path = "../pdf-template-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.4"
